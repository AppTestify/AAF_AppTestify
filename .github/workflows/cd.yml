name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t casantris/api:${{ github.sha }} .
      - name: Deploy staging
        if: inputs.environment == 'staging'
        run: |
          echo "helm upgrade --install casantris ./helm/casantris --set image.tag=${{ github.sha }}"
      - name: Deploy production (manual gate)
        if: inputs.environment == 'production'
        run: |
          echo "Production deploy requires manual approval — image casantris/api:${{ github.sha }}"
      - name: Smoke test
        run: bash scripts/smoke.sh || echo "smoke skipped in CI without compose stack"
