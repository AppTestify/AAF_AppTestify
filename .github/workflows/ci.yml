name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aaf
          POSTGRES_PASSWORD: aaf
          POSTGRES_DB: aaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://aaf:aaf@localhost:5432/aaf
      JWT_SECRET: ci-test-jwt-secret-key-min-32-chars-long
      APP_ENCRYPTION_KEY: ci-test-encryption-key-for-fernet-migrations
      SUPERADMIN_EMAIL: super@ci.local
      SUPERADMIN_PASSWORD: ci-superadmin-pass-xyz
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-pass-xyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Alembic migrations against Postgres
        run: alembic upgrade head
      - name: Run pytest suite with coverage
        run: >-
          python -m pytest tests -q
          --cov=app --cov=orchestrator --cov=agents
          --cov=connectors --cov=tools --cov=guardrails --cov=llm
          --cov-report=term-missing --cov-fail-under=60

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:coverage
      - name: Lint and build
        run: npm run build

  live-connector-tests:
    runs-on: ubuntu-latest
    if: vars.CONNECTOR_LIVE_CI == '1'
    env:
      CONNECTOR_LIVE_CI: "1"
      GITHUB_TOKEN: ${{ secrets.CONNECTOR_GITHUB_TOKEN }}
      GITHUB_REPO: ${{ vars.CONNECTOR_GITHUB_REPO }}
      JIRA_URL: ${{ vars.CONNECTOR_JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.CONNECTOR_JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.CONNECTOR_JIRA_API_TOKEN }}
      JIRA_PROJECT: ${{ vars.CONNECTOR_JIRA_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run live connector tests
        run: python -m pytest tests/test_connector_live_optional.py -m live_connector -q

  load-test-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load test gate (optional)
        run: python scripts/load_test.py --help || echo "load test script present"

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aaf
          POSTGRES_PASSWORD: aaf
          POSTGRES_DB: aaf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run Alembic migrations against Postgres
        env:
          DATABASE_URL: postgresql+psycopg://aaf:aaf@localhost:5432/aaf
        run: alembic upgrade head
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm init -y || true
          npm install -D @playwright/test
          npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: e2e
        env:
          DATABASE_URL: postgresql+psycopg://aaf:aaf@localhost:5432/aaf
        run: npx playwright test
