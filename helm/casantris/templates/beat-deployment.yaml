{{- if and .Values.celery.enabled .Values.celery.beatEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-beat
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-beat
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
          env:
            - name: APP_ENV
              value: prod
            {{- if .Values.database.url }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.celery.brokerUrl }}
            - name: CELERY_BROKER_URL
              value: {{ .Values.celery.brokerUrl | quote }}
            {{- else if .Values.redis.url }}
            - name: CELERY_BROKER_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- if .Values.celery.resultBackend }}
            - name: CELERY_RESULT_BACKEND
              value: {{ .Values.celery.resultBackend | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
{{- end }}
