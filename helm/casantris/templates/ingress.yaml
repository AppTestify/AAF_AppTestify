{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-api
  annotations:
    {{- range $k, $v := .Values.ingress.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.nginx.enabled }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-nginx
                port:
                  number: 80
          {{- end }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-api
                port:
                  number: {{ .Values.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-api
                port:
                  number: {{ .Values.service.port }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ .Chart.Name }}-api
                port:
                  number: {{ .Values.service.port }}
{{- end }}
