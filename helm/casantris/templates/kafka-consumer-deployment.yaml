{{- if and .Values.kafka.enabled .Values.kafka.consumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-kafka-consumer
spec:
  replicas: {{ .Values.kafka.consumer.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-kafka-consumer
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-kafka-consumer
    spec:
      containers:
        - name: kafka-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.consumers.kafka_worker"]
          env:
            - name: APP_ENV
              value: prod
            - name: KAFKA_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- if .Values.database.url }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
            {{- end }}
            {{- if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            - name: INTEGRATION_MODE
              value: {{ .Values.integration.mode | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
