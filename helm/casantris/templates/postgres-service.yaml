{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-postgres
  labels:
    app: {{ .Chart.Name }}-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
    {{- if .Values.pgbouncer.enabled }}
    - port: {{ .Values.pgbouncer.port }}
      targetPort: {{ .Values.pgbouncer.port }}
      protocol: TCP
      name: pgbouncer
    {{- end }}
  selector:
    app: {{ .Chart.Name }}-postgres
{{- end }}
