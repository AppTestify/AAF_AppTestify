{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "casantris.secretName" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  jwtSecret: {{ required "secrets.jwtSecret is required when secrets.create=true — use Sealed Secrets or External Secrets in production" .Values.secrets.jwtSecret | quote }}
  encryptionKey: {{ required "secrets.encryptionKey is required when secrets.create=true — use Sealed Secrets or External Secrets in production" .Values.secrets.encryptionKey | quote }}
{{- end }}
