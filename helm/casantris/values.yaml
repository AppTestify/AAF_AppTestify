replicaCount: 2

image:
  repository: casantris/api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  host: casantris.example.com
  className: ""
  annotations: {}

# Comma-separated browser origins for the React app (required in production).
corsOrigins: ""

database:
  url: ""

redis:
  enabled: true
  url: ""

celery:
  enabled: true
  replicas: 2
  beatEnabled: true
  brokerUrl: ""
  resultBackend: ""

kafka:
  enabled: false
  bootstrapServers: ""
  consumer:
    enabled: true
    replicas: 1

opensearch:
  enabled: false
  url: ""

integration:
  mode: python

apisix:
  enabled: false
  gatewayUrl: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

postgres:
  enabled: true
  storage: 20Gi

pgbouncer:
  enabled: false
  port: 6432
  poolMode: transaction
  maxClientConn: 100
  defaultPoolSize: 20
  dbUseNullpool: true

nginx:
  enabled: true

# Secrets must be supplied externally in production (Sealed Secrets / External Secrets).
# Set secrets.create=true only for local/dev chart installs with explicit --set values.
secrets:
  create: false
  existingSecretName: casantris-secrets
  jwtSecret: ""
  encryptionKey: ""

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
