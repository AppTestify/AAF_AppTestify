[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aaf-governance"
version = "0.1.0"
description = "AgileOps Agentic Framework — governance pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aaf*", "app*", "agents*", "orchestrator*", "connectors*", "llm*", "metrics*", "pm_interface*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
